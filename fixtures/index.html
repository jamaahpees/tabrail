<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout Fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 32px;
        background: #f4f1ea;
        color: #221f1a;
      }
      main {
        max-width: 560px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 8px;
      }
      #result {
        padding: 10px 12px;
        background: #fffdf8;
        border: 1px solid #d9d2c4;
      }
      #editor {
        border: 1px solid #d9d2c4;
        padding: 10px;
        margin-top: 16px;
      }
      #chart-wrap {
        position: relative;
        width: 420px;
        height: 220px;
        margin-top: 8px;
      }
      #chart {
        display: block;
        border: 1px solid #d9d2c4;
        cursor: crosshair;
      }
      #tooltip {
        position: absolute;
        padding: 4px 6px;
        background: #221f1a;
        color: #fffdf8;
        font-size: 12px;
        pointer-events: none;
        white-space: nowrap;
      }
      #scroller {
        height: 120px;
        overflow: auto;
        border: 1px solid #d9d2c4;
        background: #fffdf8;
      }
      #scroller p {
        margin: 0;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Checkout fixture</h1>
    </header>
    <main>
      <form id="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" />

        <label for="promo">Promo code</label>
        <input id="promo" name="promo" />
        <button id="apply" type="button" disabled>Apply code</button>
        <p id="result" role="status">No code applied.</p>

        <label for="carrier">Carrier</label>
        <select id="carrier" name="carrier">
          <option value="jne">JNE Reguler</option>
          <option value="sicepat">SiCepat</option>
          <option value="anteraja">AnterAja</option>
        </select>

        <button id="submit" type="submit">Place order</button>
      </form>

      <p><button id="enable" type="button">Enable apply</button></p>
      <p><button id="alert" type="button">Show confirm</button></p>
      <p><a id="next" href="/spa.html">Next page</a></p>

      <div id="list" aria-label="Items"></div>
      <div id="editor" contenteditable="true" role="textbox" aria-label="Note">Hello</div>

      <h2>Pointer lab</h2>
      <div id="chart-wrap">
        <canvas id="chart" width="420" height="220" aria-label="Pointer chart"></canvas>
        <div id="tooltip" hidden></div>
      </div>
      <p id="move-readout" role="status">move none</p>
      <p id="click-readout" role="status">click none</p>
      <p id="drop-readout" role="status">drop none</p>
      <label for="range">Range</label>
      <input id="range" type="range" min="0" max="100" value="50" />
      <p id="range-readout" role="status">50</p>
      <p id="wheel-readout" role="status">0</p>
      <div id="scroller" tabindex="0"><div id="scroller-content"></div></div>
    </main>

    <script>
      window.fixtureReady = true;
      console.log("fixture loaded");

      document.getElementById("enable").addEventListener("click", () => {
        document.getElementById("apply").disabled = false;
      });

      document.getElementById("apply").addEventListener("click", () => {
        const code = document.getElementById("promo").value.trim().toUpperCase();
        document.getElementById("result").textContent =
          code === "SAVE10" ? "Code applied: 10% off." : "Code rejected.";
      });

      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("result").textContent =
          "Order placed for " + document.getElementById("email").value;
      });

      document.getElementById("alert").addEventListener("click", () => {
        const accepted = confirm("Continue with the test order?");
        document.getElementById("result").textContent = accepted ? "Confirmed." : "Cancelled.";
      });

      const list = document.getElementById("list");
      for (const name of ["Kaos Hitam", "Jaket Olive", "Topi Kanvas"]) {
        const item = document.createElement("li");
        item.textContent = name;
        list.append(item);
      }

      const chart = document.getElementById("chart");
      const tooltip = document.getElementById("tooltip");
      const moveReadout = document.getElementById("move-readout");
      const clickReadout = document.getElementById("click-readout");
      const dropReadout = document.getElementById("drop-readout");
      const context = chart.getContext("2d");

      function chartPoint(event) {
        const rect = chart.getBoundingClientRect();
        return { x: Math.round(event.clientX - rect.left), y: Math.round(event.clientY - rect.top) };
      }

      function paint(point) {
        context.fillStyle = "#e7e0d2";
        context.fillRect(0, 0, chart.width, chart.height);
        context.fillStyle = "#b3261e";
        context.fillRect(point.x - 2, point.y - 2, 5, 5);
      }

      chart.addEventListener("mousemove", (event) => {
        const point = chartPoint(event);
        paint(point);
        tooltip.hidden = false;
        tooltip.textContent = "cell " + point.x + "," + point.y;
        tooltip.style.left = point.x + 14 + "px";
        tooltip.style.top = point.y + 14 + "px";
        moveReadout.textContent = "move " + point.x + "," + point.y;
      });

      chart.addEventListener("click", (event) => {
        const point = chartPoint(event);
        clickReadout.textContent = "click " + point.x + "," + point.y;
      });

      chart.addEventListener("mouseup", (event) => {
        const point = chartPoint(event);
        dropReadout.textContent = "drop " + point.x + "," + point.y;
      });

      const range = document.getElementById("range");
      const rangeReadout = document.getElementById("range-readout");
      range.addEventListener("input", () => {
        rangeReadout.textContent = range.value;
      });

      const scroller = document.getElementById("scroller");
      const scrollerContent = document.getElementById("scroller-content");
      const wheelReadout = document.getElementById("wheel-readout");
      for (let index = 0; index < 60; index += 1) {
        const row = document.createElement("p");
        row.textContent = "row " + index;
        scrollerContent.append(row);
      }
      scroller.addEventListener("scroll", () => {
        wheelReadout.textContent = String(Math.round(scroller.scrollTop));
      });
    </script>
  </body>
</html>
